# NPM custom config — captures the real viewer IP (X-Forwarded-For) sent by Bunny CDN.
# Place in /data/compose/21/data/nginx/custom/ on the edge server, then:
#   docker exec npm-app-1 nginx -s reload

# http_top.conf
log_format realviewer '$time_local $status "$request_uri" client=$http_x_forwarded_for ua="$http_user_agent" ref="$http_referer"';

# server_proxy.conf (this adds the real-viewer access log)
# access_log /data/logs/proxy-host-4_viewers.log realviewer;